[project]
name = "thetamax"
version = "0.1.0"
description = "Discord bot for 0DTE options poker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0",
  "aiohttp>=3.10.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
thetamax = "thetamax.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
